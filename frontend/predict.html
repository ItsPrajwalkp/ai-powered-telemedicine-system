<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patient Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>

/* ===== GLOBAL ===== */
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
}

.container {
    padding: 20px 40px;
}

/* ===== HEADER ===== */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
}

.header h2 {
    font-weight: 600;
}

.top-controls {
    display: flex;
    gap: 15px;
}

select, button {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
}

button {
    background: #ff4d4d;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #e60000;
}

/* ===== DASHBOARD ===== */
.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 25px;
    margin-top: 30px;
}

/* ===== CARD DESIGN ===== */
.card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 25px;
    color: white;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
    cursor: pointer;
}

.card:hover {
    transform: translateY(-8px) scale(1.02);
}

.card h3 {
    margin-bottom: 10px;
    font-size: 20px;
}

.card p {
    font-size: 14px;
    opacity: 0.9;
}

/* ===== FILE UPLOAD ===== */
input[type="file"] {
    margin-top: 10px;
    color: white;
}

.upload-btn {
    margin-top: 10px;
    background: #00c9a7;
}

.upload-btn:hover {
    background: #009e85;
}

/* ===== REPORT LIST ===== */
ul {
    list-style: none;
    padding: 0;
    text-align: left;
}

li {
    background: rgba(255,255,255,0.2);
    padding: 10px;
    border-radius: 10px;
    margin-top: 10px;
}

li button {
    margin-top: 5px;
    background: #4facfe;
}

</style>
</head>

<body onload="checkLogin(); loadLanguage();">

<div class="container">

<!-- ===== HEADER ===== -->
<div class="header">
    <h2 id="title">👤 Patient Dashboard</h2>

    <div>
        <select onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="hi">हिन्दी</option>
            <option value="kn">ಕನ್ನಡ</option>
        </select>

        <button onclick="logoutUser()">Logout</button>
    </div>
</div>
<!-- ===== DASHBOARD ===== -->
<div class="dashboard">

<!-- Disease Prediction -->
<div class="card" onclick="openPrediction()">
<h3 id="predict_title">🧪 Disease Prediction</h3>
<p id="predict_text">Predict disease using symptoms</p>
</div>

<!-- Chatbot -->
<div class="card" onclick="openChatbot()">
<h3 id="chat_title">🤖 AI Chatbot</h3>
<p id="chat_text">Ask health-related questions</p>
</div>

<!-- Video -->
<div class="card" onclick="openVideo()">
<h3 id="video_title">📹 Video Consultation</h3>
<p id="video_text">Start video consultation</p>
</div>

<!-- Upload -->
<div class="card">
<h3 id="upload_title">📄 Upload Medical Report</h3>

<form id="uploadForm">
<input type="file" id="reportFile" required>
<br>
<button class="upload-btn" type="submit" id="upload_btn">
Upload Report
</button>
</form>

<p id="uploadStatus"></p>
</div>

<!-- Reports -->
<div class="card">
<h3 id="my_reports">📂 My Reports & Feedback</h3>

<button onclick="loadMyReports()">Load My Reports</button>

<ul id="myReportList"></ul>
</div>

</div>
</div>

<script src="script.js"></script>

<script>

/* ===== MULTILINGUAL ===== */
const translations = {
en: {
title: "👤 Patient Dashboard",
predict_title: "🧪 Disease Prediction",
predict_text: "Predict disease using symptoms",
chat_title: "🤖 AI Chatbot",
chat_text: "Ask health-related questions",
video_title: "📹 Video Consultation",
video_text: "Start video consultation",
upload_title: "📄 Upload Medical Report",
upload_btn: "Upload Report",
my_reports: "📂 My Reports & Feedback"
},
hi: {
title: "👤 रोगी डैशबोर्ड",
predict_title: "🧪 रोग भविष्यवाणी",
predict_text: "लक्षणों का उपयोग करके रोग का अनुमान लगाएं",
chat_title: "🤖 एआई चैटबॉट",
chat_text: "स्वास्थ्य से जुड़े प्रश्न पूछें",
video_title: "📹 वीडियो परामर्श",
video_text: "वीडियो परामर्श शुरू करें",
upload_title: "📄 मेडिकल रिपोर्ट अपलोड करें",
upload_btn: "रिपोर्ट अपलोड करें",
my_reports: "📂 मेरी रिपोर्ट और प्रतिक्रिया"
},
kn: {
title: "👤 ರೋಗಿ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್",
predict_title: "🧪 ರೋಗ ಭವಿಷ್ಯವಾಣಿ",
predict_text: "ಲಕ್ಷಣಗಳನ್ನು ಬಳಸಿಕೊಂಡು ರೋಗ ಊಹಿಸಿ",
chat_title: "🤖 AI ಚಾಟ್‌ಬಾಟ್",
chat_text: "ಆರೋಗ್ಯ ಪ್ರಶ್ನೆಗಳು ಕೇಳಿ",
video_title: "📹 ವೀಡಿಯೋ ಸಲಹೆ",
video_text: "ವೀಡಿಯೋ ಸಲಹೆ ಪ್ರಾರಂಭಿಸಿ",
upload_title: "📄 ವೈದ್ಯಕೀಯ ವರದಿ ಅಪ್‌ಲೋಡ್ ಮಾಡಿ",
upload_btn: "ವರದಿ ಅಪ್‌ಲೋಡ್ ಮಾಡಿ",
my_reports: "📂 ನನ್ನ ವರದಿಗಳು ಮತ್ತು ಪ್ರತಿಕ್ರಿಯೆ"
}
};

function loadLanguage() {
const lang = localStorage.getItem("lang") || "en";
changeLanguage(lang);
}

function changeLanguage(lang) {
localStorage.setItem("lang", lang);
for (let key in translations[lang]) {
if (document.getElementById(key)) {
document.getElementById(key).innerText = translations[lang][key];
}
}
}

/* ===== LOAD REPORTS ===== */
async function loadMyReports() {
const res = await fetch("http://127.0.0.1:8000/get_reports");
const data = await res.json();

const list = document.getElementById("myReportList");
list.innerHTML = "";

data.reports.forEach(file => {
const li = document.createElement("li");

li.innerHTML = `
<b>${file}</b><br>
<a href="http://127.0.0.1:8000/download_report/${file}" target="_blank">
<button>📄 View</button>
</a>
<button onclick="checkFeedback('${file}')">Feedback</button>
`;

list.appendChild(li);
});
}

/* ===== FEEDBACK ===== */
async function checkFeedback(file) {
const res = await fetch("http://127.0.0.1:8000/get_feedback/" + file);
const data = await res.json();

alert("Doctor Feedback:\n\n" + (data.feedback || "No feedback yet"));
}

</script>

</body>
</html>
