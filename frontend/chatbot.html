<!DOCTYPE html>
<html>

<head>

<title>Multilingual Health Chatbot</title>

<link rel="stylesheet" href="style.css">

<style>

#chatbox {

width: 100%;
height: 350px;

border: 1px solid gray;

overflow-y: auto;

padding: 10px;

background: #f5f5f5;

margin-top: 10px;

border-radius: 10px;

}

input {

padding: 8px;

width: 70%;

}

button {

padding: 8px 15px;

}

</style>

</head>

<body>

<div class="container">

<h2>🤖 Multilingual Health Chatbot</h2>

<button onclick="goDashboard()">
⬅ Back to Dashboard
</button>

<br><br>

<label>Select Language:</label>

<select id="language">

<option value="en">English</option>

<option value="hi">Hindi</option>

<option value="kn">Kannada</option>

</select>

<div id="chatbox"></div>

<br>

<input
type="text"
id="userInput"
placeholder="Type your symptoms...">

<button onclick="sendMessage()">
Send
</button>

</div>

<script>

// Multilingual Responses

const responses = {

fever: {

en: "You may have fever. Drink fluids and consult doctor.",

hi: "आपको बुखार हो सकता है। पानी पिएं और डॉक्टर से मिलें।",

kn: "ನಿಮಗೆ ಜ್ವರ ಇರಬಹುದು. ನೀರು ಕುಡಿ ಮತ್ತು ವೈದ್ಯರನ್ನು ಸಂಪರ್ಕಿಸಿ."

},

cough: {

en: "Cough may indicate infection. Consult doctor if persistent.",

hi: "खांसी संक्रमण का संकेत हो सकती है। डॉक्टर से मिलें।",

kn: "ಕೆಮ್ಮು ಸೋಂಕಿನ ಸೂಚನೆ ಆಗಬಹುದು. ವೈದ್ಯರನ್ನು ಸಂಪರ್ಕಿಸಿ."

},

headache: {

en: "Take rest and drink water. If severe, consult doctor.",

hi: "आराम करें और पानी पिएं। ज्यादा होने पर डॉक्टर से मिलें।",

kn: "ವಿಶ್ರಾಂತಿ ತೆಗೆದುಕೊಳ್ಳಿ ಮತ್ತು ನೀರು ಕುಡಿಯಿರಿ."

},

vomiting: {

en: "Stay hydrated. If vomiting continues, seek medical help.",

hi: "पानी पिएं। उल्टी जारी रहे तो डॉक्टर से मिलें।",

kn: "ನೀರು ಕುಡಿಯಿರಿ. ಉಲ್ಟಿ ಮುಂದುವರಿದರೆ ವೈದ್ಯರನ್ನು ಸಂಪರ್ಕಿಸಿ."

}

};


// Send Message Function

function sendMessage() {

let input =
document.getElementById("userInput").value.toLowerCase();

let lang =
document.getElementById("language").value;

let chatbox =
document.getElementById("chatbox");

chatbox.innerHTML +=
"<p><b>You:</b> " + input + "</p>";

let reply =
"Sorry, I didn't understand.";

// Check keywords

for (let key in responses) {

if (input.includes(key)) {

reply =
responses[key][lang];

}

}

chatbox.innerHTML +=
"<p><b>Bot:</b> " + reply + "</p>";

// Clear input

document.getElementById("userInput").value = "";

}


// Back to Dashboard

function goDashboard() {

window.location.href =
"predict.html";

}

</script>

</body>

</html>
