<script>

document.getElementById("uploadForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const fileInput =
        document.getElementById("reportFile");

    const statusText =
        document.getElementById("uploadStatus");

    const formData = new FormData();

    formData.append(
        "file",
        fileInput.files[0]
    );

    try {

        const response =
            await fetch(
                "http://127.0.0.1:8000/upload_report",
                {
                    method: "POST",
                    body: formData
                }
            );

        const result =
            await response.json();

        statusText.innerText =
            "✅ Report uploaded successfully!";

    }
    catch (error) {

        statusText.innerText =
            "❌ Upload failed!";

    }

});

</script>

<!-- 📩 View Doctor Feedback -->

<div class="card">

<h3>📩 Doctor Feedback</h3>

<input type="text"
id="feedbackFile"
placeholder="Enter filename">

<br><br>

<button onclick="checkFeedback()">
Check Feedback
</button>

<p id="feedbackResult"></p>

</div>


<script>

async function checkFeedback() {

    const filename =
        document.getElementById(
        "feedbackFile"
        ).value;

    const response =
        await fetch(
        `http://127.0.0.1:8000/get_feedback/${filename}`
        );

    const data =
        await response.json();

    document.getElementById(
        "feedbackResult"
    ).innerText =
        data.feedback;

}

</script>
