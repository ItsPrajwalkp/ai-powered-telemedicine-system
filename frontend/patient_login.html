<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patient Login</title>
<script src="script.js"></script>

<style>
body {
  font-family: Arial;
  background: #0D1B3E;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.card {
  background: white;
  padding: 35px;
  border-radius: 12px;
  width: 350px;
}
input {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
}
.btn {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg,#028090,#00C9A7);
  color: white;
  border: none;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="card">
  <h2>Welcome back 👋</h2>

  <input type="email" id="login_email" placeholder="Enter Email">
  <input type="password" id="login_password" placeholder="Enter Password">

  <button class="btn" onclick="patientLogin()">Login</button>

  <p style="margin-top:10px;">
    New user?
    <a href="patient_register.html">Register</a>
  </p>

  <div id="login_result"></div>
</div>

</body>
</html>
